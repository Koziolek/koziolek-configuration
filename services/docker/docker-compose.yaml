services:
  nginx-proxy:
    image: nginx:1.27.5
    container_name: nginx-proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - $NGINX_DATA/config:/etc/nginx/conf.d
      - $NGINX_DATA/ssl:/etc/nginx/ssl
      - $NGINX_DATA/www:/usr/share/nginx/html
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - service-network
  nexus:
    image: sonatype/nexus3:3.81.1
    container_name: nexus
    user: 200:200
    volumes:
      - $NEXUS_DATA:/nexus-data
      - $NEXUS_DATA/etc/nexus.properties:/opt/sonatype/nexus/etc/nexus.properties
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Djava.util.prefs.userRoot=/nexus-data/javaprefs
    expose:
      - "8081"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - service-network
  sonarqube:
    # Community Build (LGPL v3) - bez problemów z licencją, w odróżnieniu od edycji Developer/Enterprise
    image: sonarqube:25.9.0.112764-community
    container_name: sonarqube
    env_file:
      - ~/.senv
    environment:
      SONAR_WEB_CONTEXT: /sonar
      SONAR_JDBC_URL: jdbc:postgresql://home-db:5432/sonar
      SONAR_JDBC_USERNAME: ${DB_USERNAME}
      SONAR_JDBC_PASSWORD: ${DB_PASSWORD}
    depends_on:
      home-db:
        condition: service_healthy
    volumes:
      - $SONAR_DATA/data:/opt/sonarqube/data
      - $SONAR_DATA/extensions:/opt/sonarqube/extensions
      - $SONAR_DATA/logs:/opt/sonarqube/logs
    expose:
      - "9000"
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/sonar/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - service-network
  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: pgadmin
    env_file:
      - ~/.senv
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      home-db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - service-network
  home-db:
    image: postgres:17.5
    container_name: home-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    env_file:
      - ~/.senv
    ports:
      - "127.0.0.1:16432:5432"
    volumes:
      - $POSTGRES_DATA/init.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - service-network

networks:
  service-network:
    driver: bridge
