# Jenkins Configuration as Code. Kopiowany przez configure_jenkins do $JENKINS_DATA/casc/ (CASC_JENKINS_CONFIG).
# Sekrety i wersje narzędzi z env kontenera (docker-compose.yaml), nic nie jest wpisane na stałe:
#   JENKINS_ADMIN_USER / JENKINS_ADMIN_PASSWORD  - konto admina (~/.senv)
#   DB_USERNAME / DB_PASSWORD                    - baza `jenkins` w home-db (~/.senv)
#   FORGEJO_JENKINS_USER / _TOKEN                - konto serwisowe Forgejo (token w ~/.senv, opcjonalny)
#   JENKINS_JDK_ID / JENKINS_MAVEN_ID            - wersje narzędzi (opcjonalne, domyślne poniżej)
jenkins:
  systemMessage: "Lokalny serwer CI (koziolek-configuration)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Wygląd: Simple Theme + własne logo. CSS i favicon są wbudowane (data URI), a nie pobierane z /userContent/:
# anonim nie ma odczytu (allowAnonymousRead: false), więc pliki byłyby niedostępne na ekranie logowania.
# Źródło: services/jenkins/theme/logo.png (128x128, nagłówek/login) i favicon.png (64x64). Po zmianie podmień data URI
#   (logo.png w obu regułach CSS, favicon.png w faviconUrl): base64 -w0 <plik>   (test pilnuje zgodności)
appearance:
  simpleTheme:
    elements:
      - cssText:
          text: |
            /* logo w nagłówku zamiast butlera */
            #jenkins-head-icon { content: url("data:image/png;base64,"); }
            /* napis obok logo: Jenkins -> Brother Buildius */
            .jenkins-header .app-jenkins-logo > span { font-size: 0 !important; }
            .jenkins-header .app-jenkins-logo > span::after { content: "Brother Buildius"; font-size: 1.125rem !important; }
            /* duże logo na ekranie logowania i stronach błędów */
            #jenkins-name-icon, .simple-page .logo img { content: url("data:image/png;base64,"); }
      - faviconUrl:
          url: "data:image/png;base64,"

unclassified:
  location:
    url: "https://koziolek.home/jenkins/"
  # Wspólne połączenie JDBC do bazy `jenkins` w home-db (używa go JUnit External Storage)
  globalDatabaseConfiguration:
    database:
      postgreSQL:
        database: "jenkins"
        hostname: "home-db"
        username: "${DB_USERNAME}"
        password: "${DB_PASSWORD}"
        validationQuery: "SELECT 1"
  # Lokalny Forgejo (wtyczka Gitea): adres wewnątrz sieci docker; hooków nie zarządzamy (webhook push dodaje się w repo Forgejo)
  giteaServers:
    servers:
      - displayName: "Forgejo (lokalny)"
        serverUrl: "http://forgejo:3000"
        manageHooks: false
        credentialsId: "forgejo-jenkins"
  # Wyniki testów JUnit w bazie zamiast junitResult.xml w $JENKINS_HOME
  junitTestResultStorage:
    storage: "database"

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "home-db"
              description: "Baza jenkins w home-db"
              scope: SYSTEM
              username: "${DB_USERNAME}"
              password: "${DB_PASSWORD}"
          # Konto serwisowe Forgejo (odczyt + zapis do repozytoriów): token z ~/.senv, używane przez wtyczkę gitea
          # (skanowanie, checkout) i w jobach (withCredentials / gitUsernamePassword, credentialsId 'forgejo-jenkins')
          - usernamePassword:
              id: "forgejo-jenkins"
              description: "Forgejo: konto serwisowe Jenkinsa (token)"
              scope: GLOBAL
              username: "${FORGEJO_JENKINS_USER:-jenkins}"
              password: "${FORGEJO_JENKINS_TOKEN:-}"

tool:
  # Graf zależności buildów Mavena w bazie (Pipeline Maven Integration)
  pipelineMaven:
    jdbcUrl: "jdbc:postgresql://home-db:5432/jenkins"
    JdbcCredentialsId: "home-db"
  # Narzędzia buildowe pobierane przez Jenkinsa (tool installers) - bez własnego obrazu
  jdk:
    installations:
      - name: "temurin-latest"
        properties:
          - installSource:
              installers:
                - adoptOpenJdkInstaller:
                    id: "${JENKINS_JDK_ID:-jdk-25.0.5+8}"
  maven:
    installations:
      - name: "maven-latest"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "${JENKINS_MAVEN_ID:-3.10.0}"
