    # Adres upstreamu w zmiennej + resolver Dockera: nginx nie pada przy starcie/reloadzie, gdy
    # kontener jenkins akurat nie istnieje (statyczny proxy_pass resolwuje nazwę przy ładowaniu configu).
    location /jenkins/ {
        resolver 127.0.0.11 valid=10s;
        set $jenkins_upstream http://jenkins:8080;
        # Jenkins działa z --prefix=/jenkins, więc ścieżka idzie do upstreamu bez zmian
        proxy_pass $jenkins_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        # logi konsoli buildów (strumień) i duże uploady
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        client_max_body_size 0;
    }

    location = /jenkins {
        return 301 /jenkins/;
    }
