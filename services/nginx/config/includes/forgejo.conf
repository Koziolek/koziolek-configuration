    # Adres upstreamu w zmiennej + resolver Dockera: nginx nie pada przy starcie/reloadzie, gdy
    # kontener forgejo akurat nie istnieje (statyczny proxy_pass resolwuje nazwę przy ładowaniu configu).
    location /forgejo/ {
        resolver 127.0.0.11 valid=10s;
        set $forgejo_upstream http://forgejo:3000;
        # ROOT_URL ma podścieżkę /forgejo/, a Forgejo serwuje od korzenia - prefiks zdejmuje nginx
        # (proxy_pass z URI po zmiennej: rewrite + zmienna bez ścieżki)
        rewrite ^/forgejo/(.*)$ /$1 break;
        proxy_pass $forgejo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # push/clone przez HTTP: duże obiekty bez buforowania
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    location = /forgejo {
        return 301 /forgejo/;
    }
